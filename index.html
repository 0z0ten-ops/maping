<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>史跡カフェマップ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html,body {
  height:100%;
  margin:0;
  font-family:'Noto Sans JP', sans-serif;
  background:#f3efe9;
}

/* ヘッダー */
.header {
  position:absolute;
  top:0; left:0; right:0;
  height:60px;
  background:#ede4d3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  color:#5a4634;
  border-bottom:1px solid #e0d6c5;
}

/* マップ */
#map {
  position:absolute;
  top:70px; bottom:20px;
  left:12px; right:12px;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

/* ピン */
.marker-icon {
  transition: all 0.2s ease;
}
.marker-icon:hover {
  transform: scale(1.25) translateY(-3px);
}

/* ポップアップ */
.leaflet-popup-content-wrapper {
  border-radius:16px;
  background:#fffdf8;
  color:#5a4634;
  box-shadow:0 6px 16px rgba(0,0,0,0.12);
}

</style>
</head>

<body>

<div class="header">☕ 史跡カフェマップ</div>
<div id="map"></div>

<script>

// Map
const map = L.map('map').setView([35.681,139.767],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let userMarker=null;
let markers=[];

// 距離
function dist(a,b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+
    Math.cos(a.lat*Math.PI/180)*
    Math.cos(b.lat*Math.PI/180)*
    Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ☕ カフェ風ピン
function createCafeIcon(tag){

  let color="#c8a97e"; // latte
  let icon="☕";

  if(tag.includes("史跡")){ color="#b08968"; icon="📍"; }
  if(tag.includes("川")){ color="#7f9c96"; icon="💧"; }
  if(tag.includes("噂")){ color="#a47148"; icon="💬"; }

  const html=`
  <div style="
    width:48px;
    height:48px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #fff, ${color});
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
    border:2px solid rgba(255,255,255,0.7);
  ">
    ${icon}
  </div>`;

  return L.divIcon({
    className:"marker-icon",
    html:html,
    iconSize:[48,48],
    iconAnchor:[24,24]
  });
}

// ダミーデータ（テスト用）
const data=[
  {name:"神社跡",lat:35.68,lng:139.76,tag:"史跡",comment:"静かな場所"},
  {name:"川沿い",lat:35.685,lng:139.765,tag:"川",comment:"景色が良い"},
  {name:"謎スポット",lat:35.69,lng:139.77,tag:"噂",comment:"ちょっと不思議"}
];

// マーカー表示
data.forEach(d=>{
  const m=L.marker([d.lat,d.lng],{
    icon:createCafeIcon(d.tag)
  }).addTo(map);

  m.bindPopup("");

  m.on("click",()=>{
    if(!userMarker){
      alert("現在地取得できません");
      return;
    }

    const distance=dist(userMarker.getLatLng(),m.getLatLng()).toFixed(2);

    const txt=`
      <b>${d.name}</b><br>
      ${d.comment}<br>
      距離：約${distance}km
    `;

    m.getPopup().setContent(txt);
    m.openPopup();
  });

  markers.push(m);
});

// 現在地
navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;

  userMarker=L.marker([lat,lng],{
    icon:L.divIcon({
      html:`<div style="
        font-size:26px;
        filter: drop-shadow(0 0 6px rgba(0,0,0,0.2));
      ">📍</div>`
    })
  }).addTo(map);

  map.setView([lat,lng],15);
});

</script>

</body>
</html>

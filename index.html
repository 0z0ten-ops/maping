  function updateRecommendCard(marker){  

  
  const card =  

    document.getElementById("recommend-card");  

  
  const restoreBtn =  

    document.getElementById("restore-card-btn");  


  if(!marker || !userMarker){  

    card.classList.add("hidden");  

    restoreBtn.classList.add("hidden");  

    return;  

  }  

  
  if(cardClosed){  

    card.classList.add("hidden");  

    restoreBtn.classList.remove("hidden");  

    return;  

  }  

  
  const d = marker.data;  

  
  document.getElementById("rec-name").textContent =  

    d.name;  

  
  document.getElementById("rec-comment").textContent =  

    d.comment;  


  const transportName = { 

  foot:"徒歩", 

  bike:"自転車", 

  car:"車" 

}; 


document.getElementById("rec-time").textContent = 

  `${transportName[transport]} 約${time( 

    userMarker.getLatLng(), 

    marker.getLatLng() 

  )}`; 


  document.getElementById("rec-route-btn").onclick=()=>{  

    go(d.lat,d.lng);  

  };  

    
  card.classList.remove("hidden");  

  restoreBtn.classList.add("hidden");  

}

function dist(a,b){  

  const R=6371;  

  const dLat=(b.lat-a.lat)*Math.PI/180;

  const x=Math.sin(dLat/2)**2+  

    Math.cos(a.lat*Math.PI/180)*  

    Math.cos(b.lat*Math.PI/180)*  

    Math.sin(dLng/2)**2;  

  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));  

}  

  
// 時間（修正済み）  

function time(a,b){  

  const d=dist(a,b);  

  const h=d/speed[transport];  

  const H=Math.floor(h);  

  const M=Math.round((h-H)*60);  

  return H>0 ? `${H}時間${M}分` : `${M}分`;  

}

db.ref("locations").on("value", function(snapshot) {

  const data = snapshot.val();

  console.log("Firebaseから受信:", data);


  // データがない場合
  if (!data) {

    console.log("Firebaseにlocationsがありません");

    return;

  }


  // 今あるマーカーを削除
  markers.forEach(function(marker) {

    map.removeLayer(marker);

  });

  markers = [];


  // Firebaseのデータを1件ずつ処理
  Object.values(data).forEach(function(d) {

    // 緯度・経度を数字に変換
    const lat = Number(d.lat);
    const lng = Number(d.lng);


    // 緯度・経度がないデータはスキップ
    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lng)
    ) {

      console.warn(
        "緯度・経度がないデータをスキップ:",
        d
      );

      return;

    }


    // タグが空でもエラーにならないようにする
    const tag = String(d.tag || "");


    // マーカーを作る
    const marker = L.marker(
      [lat, lng],
      {
        icon: createIcon(tag)
      }
    ).addTo(map);


    // Firebaseのデータを保存
    marker.data = {

      name: String(d.name || "名称未設定"),

      comment: String(d.comment || ""),

      tag: tag,

      lat: lat,

      lng: lng

    };


    // マーカーを配列に保存
    markers.push(marker);


    // マーカーをクリックしたとき
    marker.on("click", function() {

      const info = marker.data;

      marker.bindPopup(

        "<b>" +
        info.name +
        "</b><br>" +

        info.comment +
        "<br>" +

        "タグ：" +
        info.tag

      ).openPopup();

    });

  });


  // 読み込んだ件数を表示
  console.log(
    "地図に表示した件数:",
    markers.length
  );


  // マーカーが1つ以上あれば、
  // 全部見える位置に自動移動
  if (markers.length > 0) {

    const bounds =
      L.latLngBounds(
        markers.map(function(marker) {

          return marker.getLatLng();

        })
      );


    map.fitBounds(
      bounds,
      {
        padding: [50, 50],
        maxZoom: 15
      }
    );

  }

});

  
// 最寄り  

function findNearest(){

  if(!userMarker) return;

  let min = Infinity;
  nearest = null;

  markers.forEach(m=>{

    if(currentFilters.length > 0){

      const visible =
        currentFilters.some(filter =>
          m.data.tag.includes(filter)
        );

      if(!visible) return;
    }

    const d =
      dist(
        userMarker.getLatLng(),
        m.getLatLng()
      );

    if(d < min){

      min = d;
      nearest = m;

    }

  });

  // 候補がない場合
  if(!nearest){

    updateRecommendCard(null);

    if(window.recommendMarker){

      map.removeLayer(
        window.recommendMarker
      );

      window.recommendMarker = null;

    }

    return;

  }

  // 新しいおすすめ
  if(nearest.data.name !== lastNearestName){

    cardClosed = false;
    lastNearestName = nearest.data.name;

  }

  updateRecommendCard(nearest);

  if(window.recommendMarker){

    map.removeLayer(
      window.recommendMarker
    );

  }

  window.recommendMarker =
    L.marker(
      nearest.getLatLng(),
      {

          className:"recommend-wrap",

          html:`
            <div class="recommend-box">

let locationWatchId = null;


function startLocationTracking(){

  if(!navigator.geolocation){

    alert(
      "この端末・ブラウザでは位置情報を利用できません"
    );

    return;

  }


  locationWatchId =
    navigator.geolocation.watchPosition(

      function(pos){

        const lat =
          pos.coords.latitude;

        const lng =
          pos.coords.longitude;


        const newLatLng =
          L.latLng(lat,lng);


        // ==========================
        // 現在地マーカー
        // ==========================

        if(!userMarker){

          userMarker =
            L.marker(

              newLatLng,

              {
                icon:createUserIcon()
              }

            )
            .addTo(map)
            .bindPopup("現在地");


        }else{

          // 現在地を移動

          userMarker.setLatLng(
            newLatLng
          );

        }


        // ==========================
        // 地図を現在地に追従
        // ==========================

        if(
          firstLocation ||
          followLocation
        ){

          map.setView(

            newLatLng,

            firstLocation
              ? 15
              : map.getZoom()

          );

          firstLocation = false;

        }


        // ==========================
        // 最寄りの史跡を再計算
        // ==========================

        findNearest();


        // ==========================
        // 開いているポップアップ更新
        // ==========================

        refreshPopup();


      },


      function(error){

        console.error(
          "位置情報エラー:",
          error
        );


        if(error.code === 1){

          alert(
            "位置情報の利用が許可されていません"
          );

        }

        else if(error.code === 2){

          alert(
            "現在地を取得できません"
          );

        }

        else if(error.code === 3){

          alert(
            "現在地の取得がタイムアウトしました"
          );

        }

      },


      {

        enableHighAccuracy:true,

        timeout:10000,

        maximumAge:3000

      }

    );

}

function updateCompass(event){

  let heading = null;

  // iPhone / iPad
  if(
    event.webkitCompassHeading !== undefined &&
    event.webkitCompassHeading !== null
  ){

    heading = event.webkitCompassHeading;

  }

  // Android
  else if(event.alpha !== null){

    heading = 360 - event.alpha;

  }

  if(heading === null){
    return;
  }

  const arrow =
    document.querySelector(".user-heading");

  if(arrow){

    arrow.style.transform =
      `translateX(-50%) rotate(${heading}deg)`;

  }

}


async function startCompass(){

  // iPhone / iPadでは許可が必要
  if(
    typeof DeviceOrientationEvent !== "undefined" &&
    typeof DeviceOrientationEvent.requestPermission === "function"
  ){

    try{

      const permission =
        await DeviceOrientationEvent.requestPermission();

      if(permission !== "granted"){

        alert("コンパスの利用が許可されませんでした");

        return;

      }

    }catch(error){

      console.error(error);

      alert("コンパスを利用できません");

      return;

    }

  }


  // 二重登録を防ぐ
  window.removeEventListener(
    "deviceorientation",
    updateCompass,
    true
  );


  window.addEventListener(
    "deviceorientation",
    updateCompass,
    true
  );


  const btn =
    document.getElementById("compass-btn");


  btn.classList.add("active");

  btn.textContent = "🧭コンパスON";

}

  // ================================
// HTMLエスケープ
// ================================

function escapeHTML(text){

  if(text === undefined ||
     text === null){

    return "";

  }

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

            ${escapeHTML(d.name)}
          </div>

          <div class="location-comment">
            ${escapeHTML(d.comment)}
          </div>

        </div>

        <button
          class="favorite-btn ${
            favorite
              ? "is-favorite"
              : ""
          }"
        >
          ${favorite ? "⭐" : "☆"}
        </button>

      `;


      const favoriteBtn =
        item.querySelector(
          ".favorite-btn"
        );


      favoriteBtn.onclick =
        function(event){

          event.stopPropagation();

          toggleFavorite(d.name);

        };


      item.onclick = () => {

        map.setView(
          marker.getLatLng(),
          17
        );


        marker.openPopup();

        closeLocationList();

      };


      list.appendChild(item);

    });

  }


  panel.classList.remove(
    "hidden-panel"
  );

}

  // ================================
// 検索
// ================================

function searchLocations(){

  const input =
    document.getElementById("search-input");

  const keyword =
    input.value.trim().toLowerCase();

  if(keyword === ""){

    updateMarkers();

    return;

  }

  markers.forEach(m=>{

    const d = m.data;

    const text = `
      ${d.name}
      ${d.comment}
      ${d.tag}
    `.toLowerCase();

    if(text.includes(keyword)){

      map.addLayer(m);

    }else{

      map.removeLayer(m);

    }

  });

}

  document
  .getElementById("search-input")
  .addEventListener("keydown",function(event){

    if(event.key === "Enter"){

      searchLocations();

    }

  });

  
</script>  


</body>  


</html>

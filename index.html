<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>史跡マップ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
html,body {
  height:100%;
  margin:0;
  font-family:'Noto Sans JP', sans-serif;
  background:#f5f2ed;
}

.header {
  position:absolute;
  top:0; left:0; right:0;
  height:60px;
  background: rgba(214,195,163,0.95);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:600;
  color:#3e2f1c;
  z-index:1000;
}

#map {
  position:absolute;
  top:70px; bottom:70px;
  left:10px; right:10px;
  border-radius:16px;
}

.bottom-bar {
  position:absolute;
  bottom:0;
  left:0; right:0;
  height:70px;
  background: rgba(245,239,230,0.95);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

button {
  border:none;
  border-radius:20px;
  padding:6px 12px;
  background:#d6c3a3;
}

.marker-icon:hover {
  transform: scale(1.3);
}
</style>
</head>

<body>

<div class="header">史跡マップ</div>
<div id="map"></div>

<div class="bottom-bar">
  <button onclick="setTransport('foot')">徒歩</button>
  <button onclick="setTransport('bike')">自転車</button>
  <button onclick="setTransport('car')">車</button>
</div>

<script>
// Firebase
const firebaseConfig = {
  apiKey:"AIzaSyA_bAVs54VH8egBWlLHGXpq-34HNR97PRg",
  databaseURL:"https://map-yoisyo-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Map
const map = L.map('map').setView([35.681,139.767],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers = [];
let userMarker = null;
let transport = "foot";

const speed = {foot:4.8,bike:17,car:50};

// 距離
function dist(a,b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+
    Math.cos(a.lat*Math.PI/180)*
    Math.cos(b.lat*Math.PI/180)*
    Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// 時間
function time(a,b){
  const d=dist(a,b);
  const h=d/speed[transport];
  const H=Math.floor(h);
  const M=Math.round((h-H)*60);
  return H>0 ? `${H}時間${M}分` : `${M}分`;
}

// 和風ピン
function createIcon(tag){
  let icon = "🪨";

  if(tag.includes("展示施設")) icon="🏯";
  else if(tag.includes("史跡")) icon="⛩️";
  else if(tag.includes("噂")) icon="🏮";
  else if(tag.includes("川")) icon="🌊";

  return L.divIcon({
    className:"marker-icon",
    html:`<div style="font-size:28px;">${icon}</div>`,
    iconSize:[40,40],
    iconAnchor:[20,20]
  });
}

// Firebase読み込み
db.ref("locations").on("value",snap=>{
  const data=snap.val();
  if(!data) return;

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  Object.values(data).forEach(d=>{
    const m = L.marker([d.lat,d.lng],{
      icon:createIcon(d.tag)
    }).addTo(map);

    // 1回だけbind
    m.bindPopup("");

    m.on("click",()=>{
      if(!userMarker){
        alert("現在地取得できません");
        return;
      }

      const txt = `
        <b>${d.name}</b><br>
        ${d.comment}<br>
        ${d.tag}<br>
        所要時間:${time(userMarker.getLatLng(),m.getLatLng())}<br>
        <button onclick="go(${d.lat},${d.lng})">ルート</button>
      `;

      m.getPopup().setContent(txt);
      m.openPopup();
    });

    markers.push(m);
  });
});

// ルート（簡易）
function go(lat,lng){
  L.polyline([userMarker.getLatLng(),[lat,lng]],{
    color:'brown'
  }).addTo(map);
}

// 現在地
navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;

  userMarker=L.marker([lat,lng],{
    icon:L.divIcon({
      html:"📍",
      iconSize:[40,40]
    })
  }).addTo(map);

  map.setView([lat,lng],15);
});

function setTransport(t){
  transport=t;
}
</script>

</body>
</html>

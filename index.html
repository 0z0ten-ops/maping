<script>

// SVGピン生成（和風）
function createIcon(tag){
  let svg='';

  // 展示施設（蔵・博物館風）
  if(tag.includes("展示施設")){
    svg=`
    <svg width="42" height="42" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="#a67c52"/>
      <text x="12" y="16" font-size="13" text-anchor="middle">🏯</text>
    </svg>`;
  }

  // 史跡（鳥居）
  else if(tag.includes("史跡")){
    svg=`
    <svg width="42" height="42" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="#c0392b"/>
      <text x="12" y="16" font-size="13" text-anchor="middle">⛩️</text>
    </svg>`;
  }

  // 噂（提灯）
  else if(tag.includes("噂")){
    svg=`
    <svg width="42" height="42" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="#d35400"/>
      <text x="12" y="16" font-size="13" text-anchor="middle">🏮</text>
    </svg>`;
  }

  // 川（水紋）
  else if(tag.includes("川")){
    svg=`
    <svg width="42" height="42" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="#2980b9"/>
      <text x="12" y="16" font-size="13" text-anchor="middle">🌊</text>
    </svg>`;
  }

  // その他（石碑）
  else{
    svg=`
    <svg width="42" height="42" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="#5a4a3f"/>
      <text x="12" y="16" font-size="13" text-anchor="middle">🪨</text>
    </svg>`;
  }

  return L.divIcon({
    className:"marker-icon",
    html:svg,
    iconSize:[42,42],
    iconAnchor:[21,21]
  });
}


// Firebaseデータ読み込み
db.ref("locations").on("value",snap=>{
  const data=snap.val();
  if(!data) return;

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  Object.values(data).forEach(d=>{

    const m=L.marker([d.lat,d.lng],{
      icon:createIcon(d.tag)
    }).addTo(map);

    m.data=d;

    // ★ ポップアップは最初に1回だけ
    m.bindPopup("");

    m.on("click",()=>{
      if(!userMarker) return alert("現在地取得できません");

      const txt=`
        <b>${d.name}</b><br>
        ${d.comment}<br>
        ${d.tag}<br>
        所要時間:${time(userMarker.getLatLng(),m.getLatLng())}<br>
        <button onclick="go(${d.lat},${d.lng})">ルート</button>
      `;

      // ★ ここだけ更新
      m.getPopup().setContent(txt);
      m.openPopup();
    });

    markers.push(m);
  });

  findNearest();
});


// 現在地
navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;

  userMarker=L.marker([lat,lng],{
    icon:L.divIcon({
      html:`<div style="font-size:28px;">📍</div>`,
      iconSize:[42,42],
      iconAnchor:[21,21]
    })
  }).addTo(map).bindPopup("現在地");

  map.setView([lat,lng],15);
  findNearest();
});

</script>
